
---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    dockerfile_path: "."
    image_name: "my-country-service"
    image_tag: "3"
    namespace: "jenkins"
    kubeconfig_path: "./config"

  tasks:

    # 1. Connexion à Docker Hub
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: true

    # 2. Construction de l'image Docker
    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ dockerfile_path }}"
        state: present

    # 3. Envoi de l'image vers Docker Hub
    - name: Push Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: local
        push: true

    # 4. Récupération de l'image pour vérification
    - name: Pull Docker image from Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull

    # 5. Création du namespace Kubernetes
    - name: Create Kubernetes namespace
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    # 6. Déploiement de l'application
    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "./deployment.yml"
        kubeconfig: "{{ kubeconfig_path }}"

    # 7. Création du Service Kubernetes
    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "./service.yml"
        kubeconfig: "{{ kubeconfig_path }}"
